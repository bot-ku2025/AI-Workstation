name: AI Workstation — Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Verify and build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up exact Gradle version required by AGP 9.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Verify repository before build
        run: |
          chmod +x ./gradlew ./ci/verify-source.sh
          ./ci/verify-source.sh
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Run JVM tests
        run: |
          gradle testDebugUnitTest --no-daemon --max-workers=2 --no-configuration-cache

      - name: Build real debug APK — source only, no AI/code generation
        run: |
          gradle assembleDebug --no-daemon --max-workers=2 --no-configuration-cache

      - name: Verify build did not modify source
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Verify real APK exists
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Workstation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
